# The only door into the stack. Everything else stays on the private Docker network.

# One worker is enough here, and it shares requests evenly between the two api instances
# (several workers would each keep their own count and start unevenly).
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # One JSON object per line, with the request id that is passed on to the api.
    log_format json escape=json
        '{"time":"$time_iso8601","service":"nginx","requestId":"$request_id",'
        '"remoteAddr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"durationSeconds":$request_time,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Both api instances; requests are shared between them in turn.
    upstream api {
        server api1:4000;
        server api2:4000;
        keepalive 16;
    }

    server {
        listen 8080;

        # Redirect with a path only (/api/docs/). Otherwise nginx writes its own port (8080)
        # into the address, which is wrong when the stack is published on another port.
        absolute_redirect off;

        # For Docker's health check.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The docs page needs the trailing slash; add it here, keeping the /api prefix.
        location = /api/docs {
            return 301 /api/docs/;
        }

        # /api/health -> api /health  (the trailing slash in proxy_pass removes the /api prefix)
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Request-Id $request_id;
            # Replace whatever the browser sent, never append to it.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
